# ClipLens — local multi-tenant dev routing
# ──────────────────────────────────────────
# Wildcard *.cliplens.local + bare cliplens.local → Django on :8000
# Source of truth — copy this to /opt/homebrew/etc/nginx/servers/cliplens-local.conf
# and `sudo nginx -s reload` after any change.

server {
    listen 80;
    # Match BOTH the bare root 'cliplens.local' (marketing landing) AND any
    # '*.cliplens.local' subdomain (org tenants + admin). The capture group
    # is optional so bare-domain requests also hit this block.
    server_name ~^((?<tenant>[a-z0-9\-]+)\.)?cliplens\.local$;

    # Writable temp directory for large request bodies (uploads).
    # In home dir so it survives macOS reboots (unlike /tmp).
    client_body_temp_path /Users/sohammaskara/.nginx_tmp/client_body;

    # Pass the original Host so Django's TenantMiddleware sees the subdomain
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Allow large video uploads (4 GB)
    client_max_body_size 4096m;

    # ───────── Timeouts ─────────
    # AI provisioning, video uploads, and rendered-redacted downloads can take
    # a long time. 1 hour is safe for dev.
    proxy_connect_timeout  10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # ───────── Buffering (CRITICAL) ─────────
    # Without this, nginx buffers the entire response body before relaying
    # it to the browser. For a 5+ MB MP4 download Safari gets nothing for
    # seconds, decides the connection is dead, and aborts the download.
    proxy_buffering         off;
    proxy_request_buffering off;   # also disable buffering for uploads
    proxy_http_version      1.1;   # required when buffering is off
    proxy_set_header        Connection "";

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    # OPTIONAL — serve /media/ directly from nginx for speed.
    # Tenant-isolated paths still work because the directory structure
    # is preserved. Uncomment to enable.
    # location /media/ {
    #     alias /Users/sohammaskara/Desktop/Freestream/media/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }
}
