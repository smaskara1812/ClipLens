<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClipStream — Player</title>
  <!-- hls.js for m3u8 playback in any browser -->
  <script src="hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #18181f;
      border-bottom: 1px solid #2a2a35;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 22px; font-weight: 700; color: #7c6af7; letter-spacing: -0.5px; }
    header .logo span { color: #e4e4e7; }
    header nav { margin-left: auto; display: flex; gap: 16px; }
    header nav a {
      color: #a1a1aa; text-decoration: none; font-size: 14px;
      padding: 6px 14px; border-radius: 6px; transition: background 0.2s;
    }
    header nav a:hover { background: #2a2a35; color: #e4e4e7; }
    header nav a.active { background: #7c6af7; color: #fff; }

    main { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 32px 24px; }

    /* Search bar */
    .search-wrap {
      display: flex; gap: 10px; margin-bottom: 32px;
    }
    .search-wrap input {
      flex: 1; background: #18181f; border: 1px solid #2a2a35;
      border-radius: 8px; padding: 11px 16px; font-size: 14px;
      color: #e4e4e7; outline: none; font-family: inherit;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: #7c6af7; }
    .search-wrap input::placeholder { color: #52525b; }
    .search-wrap button {
      background: #7c6af7; border: none; color: #fff;
      padding: 11px 22px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: background 0.2s;
    }
    .search-wrap button:hover { background: #6d5de0; }

    /* Two-column layout */
    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

    /* ── Player ── */
    .player-col {}

    .video-wrap {
      position: relative; background: #000;
      border-radius: 12px; overflow: hidden;
      aspect-ratio: 16/9;
    }
    video {
      width: 100%; height: 100%; display: block;
      background: #000;
    }

    .player-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: #52525b;
    }
    .player-placeholder .ph-icon { font-size: 52px; }
    .player-placeholder p { font-size: 14px; }

    .player-loading {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #3a3a4a;
      border-top-color: #7c6af7; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .video-info { margin-top: 18px; }
    .video-info h2 { font-size: 20px; font-weight: 700; line-height: 1.3; }
    .video-meta {
      display: flex; flex-wrap: wrap; gap: 14px;
      margin-top: 10px; font-size: 13px; color: #71717a;
    }
    .video-meta span { display: flex; align-items: center; gap: 5px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 10px; border-radius: 999px;
    }
    .badge.ready { background: #14301a; color: #4ade80; }
    .badge.processing { background: #1a1a2e; color: #7c6af7; }
    .badge.pending { background: #2a2a35; color: #a1a1aa; }
    .badge.failed { background: #2a1111; color: #f87171; }

    .video-desc {
      margin-top: 14px; font-size: 14px; color: #a1a1aa;
      line-height: 1.6; white-space: pre-wrap;
    }
    .video-tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: #23232e; border: 1px solid #2a2a35;
      border-radius: 6px; padding: 3px 10px; font-size: 12px; color: #a78bfa;
    }

    .hls-url-row {
      margin-top: 16px; background: #18181f; border: 1px solid #2a2a35;
      border-radius: 8px; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .hls-url-row .url-label { font-size: 11px; color: #52525b; white-space: nowrap; }
    .hls-url-row .url-val {
      flex: 1; font-size: 12px; color: #7c6af7;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .copy-btn {
      background: #2a2a35; border: none; color: #a1a1aa;
      padding: 4px 10px; border-radius: 5px; cursor: pointer;
      font-size: 12px; white-space: nowrap;
    }
    .copy-btn:hover { background: #3a3a4a; color: #e4e4e7; }

    /* ── Sidebar list ── */
    .sidebar-col {}
    .sidebar-title {
      font-size: 13px; font-weight: 600; color: #71717a;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .video-list { display: flex; flex-direction: column; gap: 10px; }

    .video-item {
      display: flex; gap: 12px; cursor: pointer;
      padding: 10px; border-radius: 10px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .video-item:hover { background: #18181f; border-color: #2a2a35; }
    .video-item.active { background: #1a1728; border-color: #7c6af7; }

    .thumb-wrap {
      width: 96px; min-width: 96px; aspect-ratio: 16/9;
      background: #18181f; border-radius: 6px; overflow: hidden;
      position: relative;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-placeholder {
      width: 100%; height: 100%; display: flex;
      align-items: center; justify-content: center; font-size: 22px;
    }
    .thumb-duration {
      position: absolute; bottom: 3px; right: 4px;
      background: rgba(0,0,0,0.75); color: #fff;
      font-size: 10px; padding: 1px 5px; border-radius: 3px;
    }

    .item-info { flex: 1; overflow: hidden; }
    .item-title {
      font-size: 13px; font-weight: 600; line-height: 1.4;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .item-sub { font-size: 11px; color: #71717a; margin-top: 4px; }
    .item-badge { margin-top: 5px; }

    /* Search box for sidebar */
    .sidebar-search {
      background: #18181f; border: 1px solid #2a2a35;
      border-radius: 8px; padding: 8px 12px; font-size: 13px;
      color: #e4e4e7; outline: none; width: 100%;
      margin-bottom: 14px; font-family: inherit;
      transition: border-color 0.2s;
    }
    .sidebar-search:focus { border-color: #7c6af7; }

    .empty-state {
      text-align: center; padding: 32px 0;
      color: #52525b; font-size: 14px;
    }

    /* ID lookup bar */
    .lookup-bar {
      display: flex; gap: 8px; margin-bottom: 28px;
    }
    .lookup-bar input {
      flex: 1; background: #18181f; border: 1px solid #2a2a35;
      border-radius: 8px; padding: 10px 14px; font-size: 13px;
      color: #e4e4e7; outline: none; font-family: inherit;
      transition: border-color 0.2s;
    }
    .lookup-bar input:focus { border-color: #7c6af7; }
    .lookup-bar input::placeholder { color: #52525b; }
    .lookup-bar button {
      background: #23232e; border: 1px solid #2a2a35; color: #a78bfa;
      padding: 10px 18px; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: background 0.2s;
      white-space: nowrap;
    }
    .lookup-bar button:hover { background: #2a2a35; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #23232e; border: 1px solid #3a3a4a;
      border-radius: 10px; padding: 12px 18px;
      font-size: 13px; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(80px); opacity: 0;
      transition: transform 0.3s, opacity 0.3s; z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: #4ade80; }
    .toast.error { border-color: #f87171; }
  </style>
</head>
<body>

<header>
  <div class="logo">Clip<span>Stream</span></div>
  <nav>
    <a href="upload.html">Upload</a>
    <a href="player.html" class="active">Player</a>
  </nav>
</header>

<main>

  <!-- Load by ID -->
  <div class="lookup-bar">
    <input id="lookupId" placeholder="Paste a Video ID to load it directly…" />
    <button onclick="loadById()">Load Video</button>
  </div>

  <div class="layout">

    <!-- Left: player -->
    <div class="player-col">
      <div class="video-wrap" id="videoWrap">
        <div class="player-placeholder" id="placeholder">
          <div class="ph-icon">▶️</div>
          <p>Select a video from the list or paste an ID above</p>
        </div>
        <div class="player-loading" id="playerLoading">
          <div class="spinner"></div>
        </div>
        <video id="videoEl" controls style="display:none;"></video>
      </div>

      <div class="video-info" id="videoInfo" style="display:none;">
        <h2 id="vTitle"></h2>
        <div class="video-meta">
          <span id="vStatus"></span>
          <span id="vDuration"></span>
          <span id="vResolution"></span>
          <span id="vViews"></span>
          <span id="vUploadedBy"></span>
        </div>
        <div class="video-desc" id="vDesc"></div>
        <div class="video-tags" id="vTags"></div>
        <div class="hls-url-row" id="hlsUrlRow" style="display:none;">
          <span class="url-label">HLS</span>
          <span class="url-val" id="hlsUrlVal"></span>
          <button class="copy-btn" onclick="copyHls()">Copy URL</button>
        </div>
      </div>
    </div>

    <!-- Right: video list -->
    <div class="sidebar-col">
      <input class="sidebar-search" id="sidebarSearch" placeholder="Search videos…" oninput="filterSidebar()" />
      <div class="sidebar-title">All Videos</div>
      <div class="video-list" id="videoList">
        <div class="empty-state">Loading videos…</div>
      </div>
    </div>

  </div>
</main>

<div class="toast" id="toast">
  <span id="toastIcon">✅</span>
  <span id="toastMsg"></span>
</div>

<script>
  const API = 'http://localhost:8000/api';
  let allVideos = [];
  let currentHls = null;
  let currentVideoId = null;

  // ── Init ──
  (async () => {
    await loadVideoList();
    // Auto-load from ?id= query param
    const params = new URLSearchParams(location.search);
    if (params.get('id')) {
      document.getElementById('lookupId').value = params.get('id');
      loadById();
    }
  })();

  // ── Load all videos ──
  async function loadVideoList() {
    try {
      const res = await fetch(`${API}/videos/`);
      const data = await res.json();
      allVideos = data.results || [];
      renderSidebar(allVideos);
    } catch {
      document.getElementById('videoList').innerHTML =
        '<div class="empty-state">Could not reach API.<br>Is the server running?</div>';
    }
  }

  // ── Render sidebar ──
  function renderSidebar(videos) {
    const list = document.getElementById('videoList');
    if (!videos.length) {
      list.innerHTML = '<div class="empty-state">No videos found.</div>';
      return;
    }
    list.innerHTML = videos.map(v => `
      <div class="video-item ${v.id === currentVideoId ? 'active' : ''}"
           onclick="loadVideo('${v.id}')">
        <div class="thumb-wrap">
          ${v.thumbnail_url
            ? `<img src="http://localhost:8000${v.thumbnail_url}" alt="" />`
            : `<div class="thumb-placeholder">🎬</div>`}
          ${v.duration ? `<div class="thumb-duration">${fmtDur(v.duration)}</div>` : ''}
        </div>
        <div class="item-info">
          <div class="item-title">${escHtml(v.title)}</div>
          <div class="item-sub">${v.uploaded_by || 'Unknown'} · ${fmtDate(v.created_at)}</div>
          <div class="item-badge"><span class="badge ${v.status}">${v.status}</span></div>
        </div>
      </div>
    `).join('');
  }

  // ── Filter sidebar ──
  function filterSidebar() {
    const q = document.getElementById('sidebarSearch').value.toLowerCase();
    renderSidebar(q
      ? allVideos.filter(v =>
          v.title.toLowerCase().includes(q) ||
          (v.tags || '').toLowerCase().includes(q) ||
          (v.uploaded_by || '').toLowerCase().includes(q))
      : allVideos
    );
  }

  // ── Load by ID input ──
  function loadById() {
    const id = document.getElementById('lookupId').value.trim();
    if (!id) return;
    loadVideo(id);
  }

  // ── Load & play a video ──
  async function loadVideo(id) {
    currentVideoId = id;
    document.getElementById('lookupId').value = id;
    showPlayerLoading(true);
    renderSidebar(allVideos); // refresh active state

    try {
      const res = await fetch(`${API}/videos/${id}/`);
      if (!res.ok) throw new Error('Video not found');
      const v = await res.json();

      fillInfo(v);

      if (v.status !== 'ready' || !v.hls_url) {
        showPlayerLoading(false);
        showPlaceholder(`Status: ${v.status}. Stream not ready yet.`);
        if (v.status === 'processing' || v.status === 'pending') {
          pollUntilReady(id);
        }
        return;
      }

      const hlsSrc = `http://localhost:8000${v.hls_url}`;
      playHls(hlsSrc);

    } catch (err) {
      showPlayerLoading(false);
      showPlaceholder('Could not load video.');
      showToast('error', err.message);
    }
  }

  // ── Play HLS ──
  function playHls(src) {
    const video = document.getElementById('videoEl');
    if (currentHls) { currentHls.destroy(); currentHls = null; }

    // Prefer hls.js on ALL browsers (including Safari 11.1+ with MSE).
    // Native Safari HLS does NOT receive CORS headers Django sets via middleware —
    // the browser fetches .ts segments directly bypassing JS, so CORS fails.
    // hls.js fetches everything through XHR/fetch which respects our CORS headers.
    if (Hls.isSupported()) {
      currentHls = new Hls({
        // Workers are blocked on file:// origin in Safari — must be false
        enableWorker: false,
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        manifestLoadingMaxRetry: 3,
        levelLoadingMaxRetry: 3,
        fragLoadingMaxRetry: 3,
      });
      currentHls.loadSource(src);
      currentHls.attachMedia(video);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
        showPlayerLoading(false);
        showVideo();
        video.play().catch(() => {});
      });
      currentHls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) {
          showPlayerLoading(false);
          showPlaceholder('Playback error. Check server.');
          showToast('error', 'HLS playback error');
        }
      });
    } else {
      // Very old Safari (pre-MSE) — last resort native path
      video.src = src;
      video.addEventListener('loadedmetadata', () => {
        showPlayerLoading(false);
        showVideo();
        video.play().catch(() => {});
      }, { once: true });
      video.addEventListener('error', () => {
        showPlayerLoading(false);
        showPlaceholder('Playback not supported in this browser.');
      }, { once: true });
    }

  }

  // ── Poll until ready ──
  function pollUntilReady(id) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${API}/videos/${id}/status/`);
        const d = await res.json();
        if (d.status === 'ready') {
          clearInterval(interval);
          showToast('success', 'Video is ready! Loading…');
          loadVideo(id);
        }
        if (d.status === 'failed') {
          clearInterval(interval);
          showPlaceholder('Processing failed.');
          showToast('error', 'Processing failed');
        }
      } catch { clearInterval(interval); }
    }, 4000);
  }

  // ── Fill info panel ──
  function fillInfo(v) {
    document.getElementById('videoInfo').style.display = 'block';
    document.getElementById('vTitle').textContent = v.title;

    document.getElementById('vStatus').innerHTML =
      `<span class="badge ${v.status}">${v.status}</span>`;
    document.getElementById('vDuration').textContent =
      v.duration ? '⏱ ' + fmtDur(v.duration) : '';
    document.getElementById('vResolution').textContent =
      v.resolution ? '🖥 ' + v.resolution : '';
    document.getElementById('vViews').textContent =
      '👁 ' + (v.views_count || 0) + ' views';
    document.getElementById('vUploadedBy').textContent =
      v.uploaded_by ? '👤 ' + v.uploaded_by : '';
    document.getElementById('vDesc').textContent = v.description || '';

    const tagsEl = document.getElementById('vTags');
    tagsEl.innerHTML = '';
    if (v.tags) {
      v.tags.split(',').map(t => t.trim()).filter(Boolean).forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = '#' + t;
        tagsEl.appendChild(s);
      });
    }

    if (v.hls_url) {
      const full = `http://localhost:8000${v.hls_url}`;
      document.getElementById('hlsUrlVal').textContent = full;
      document.getElementById('hlsUrlRow').style.display = 'flex';
    }
  }

  // ── UI helpers ──
  function showVideo() {
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('videoEl').style.display = 'block';
  }
  function showPlaceholder(msg) {
    const ph = document.getElementById('placeholder');
    ph.style.display = 'flex';
    ph.querySelector('p').textContent = msg;
    document.getElementById('videoEl').style.display = 'none';
  }
  function showPlayerLoading(on) {
    document.getElementById('playerLoading').style.display = on ? 'flex' : 'none';
  }
  function copyHls() {
    const url = document.getElementById('hlsUrlVal').textContent;
    navigator.clipboard.writeText(url);
    showToast('success', 'HLS URL copied!');
  }
  function showToast(type, msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastIcon').textContent = type === 'success' ? '✅' : '❌';
    document.getElementById('toastMsg').textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3500);
  }
  function fmtDur(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2,'0')}`;
  }
  function fmtDate(iso) {
    return iso ? new Date(iso).toLocaleDateString() : '';
  }
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
