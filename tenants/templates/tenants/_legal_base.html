<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ClipLens{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'videos/logos/favicon-32x32-dark.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'videos/logos/favicon-16x16-dark.png' %}">
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'videos/logos/favicon-dark.ico' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'videos/logos/apple-touch-icon.png' %}">

  <style>
    :root {
      --bg:           #07090d;
      --bg-2:         #0c1118;
      --bg-3:         #11161e;
      --surface:      #161c25;
      --surface-2:    #1c2330;
      --border:       #232b38;
      --border-soft:  #1a212c;
      --text:         #e8edf5;
      --text-muted:   #8b96a8;
      --text-soft:    #5b6678;
      --accent:       #6da6ff;
      --accent-hi:    #8fc1ff;
      --radius:       12px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hi); text-decoration: underline; }

    /* Nav */
    .nav {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(14px) saturate(140%);
      background: rgba(7, 9, 13, 0.78);
      border-bottom: 1px solid var(--border-soft);
    }
    .nav-inner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 28px;
      max-width: 1180px; margin: 0 auto;
    }
    .nav-logo img { height: 28px; }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { color: var(--text-muted); font-size: 14px; font-weight: 500; }
    .nav-links a:hover { color: var(--text); text-decoration: none; }
    .nav-cta {
      padding: 9px 18px; border-radius: 8px;
      background: linear-gradient(180deg, var(--accent), #5093f0);
      color: #fff !important; font-size: 14px; font-weight: 600;
    }
    .nav-cta:hover { color: #fff !important; filter: brightness(1.08); text-decoration: none !important; }

    /* Doc layout */
    .doc {
      max-width: 820px; margin: 0 auto;
      padding: 80px 28px 80px;
    }
    .doc .eyebrow {
      display: inline-block; color: var(--accent);
      font-size: 12px; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .doc h1 {
      font-size: 48px; font-weight: 700; letter-spacing: -.025em;
      line-height: 1.1; margin: 0 0 12px;
    }
    .doc .meta {
      color: var(--text-soft); font-size: 13px; margin-bottom: 48px;
      padding-bottom: 24px; border-bottom: 1px solid var(--border-soft);
    }
    .doc h2 {
      font-size: 22px; font-weight: 700; letter-spacing: -.015em;
      margin: 48px 0 16px; color: var(--text);
    }
    .doc h3 {
      font-size: 16px; font-weight: 600; letter-spacing: -.01em;
      margin: 24px 0 8px; color: var(--text);
    }
    .doc p { color: var(--text-muted); margin: 0 0 14px; font-size: 15px; }
    .doc ul, .doc ol { color: var(--text-muted); padding-left: 22px; margin: 0 0 14px; }
    .doc li { margin-bottom: 8px; font-size: 15px; }
    .doc li strong { color: var(--text); }
    .doc strong { color: var(--text); font-weight: 600; }
    .doc code {
      background: var(--surface);
      padding: 2px 6px; border-radius: 4px;
      font-size: 13px; color: var(--accent);
      font-family: 'SF Mono', Menlo, monospace;
    }
    .doc .callout {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px; margin: 24px 0;
      font-size: 14px; color: var(--text-muted);
    }
    .doc .callout strong { color: var(--accent); }

    .doc-toc {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 24px;
      margin-bottom: 40px;
    }
    .doc-toc h4 {
      font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-soft);
      margin: 0 0 12px;
    }
    .doc-toc ol { padding-left: 18px; margin: 0; counter-reset: list; }
    .doc-toc li { font-size: 14px; margin-bottom: 6px; }
    .doc-toc a { color: var(--text-muted); }
    .doc-toc a:hover { color: var(--accent); text-decoration: none; }

    /* Footer */
    footer {
      padding: 40px 28px;
      border-top: 1px solid var(--border-soft);
      background: var(--bg);
    }
    .footer-inner {
      max-width: 1180px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px;
      color: var(--text-soft); font-size: 13px;
    }
    .footer-inner a { color: var(--text-muted); margin: 0 10px; }
    .footer-inner a:hover { color: var(--text); }

    @media (max-width: 720px) {
      .doc { padding: 48px 22px; }
      .doc h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="{% static 'videos/logos/logo-long-dark.png' %}" alt="ClipLens">
      </a>
      <div class="nav-links">
        <a href="/#capabilities">Capabilities</a>
        <a href="/#plans">Plans</a>
        <a href="/#faq">FAQ</a>
        <a href="/#contact" class="nav-cta">Request demo</a>
      </div>
    </div>
  </nav>

  <main class="doc">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="footer-inner">
      <div>© {% now "Y" %} ClipLens · Made by Soham Maskara</div>
      <div>
        <a href="/">Home</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/#contact">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
